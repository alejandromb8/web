<html>
  <head>
    <title>Calculadora</title>
    <script src="js/calculadora.js"></script>
  </head>
  <body>
    <table>
        <thead>
            <input type="text" id="pantalla" readonly value="0">
        </thead>

        <tbody>
            <tr>
                <td><button onclick="escribir('7')">7</button></td>
                <td><button onclick="escribir('8')">8</button></td>
                <td><button onclick="escribir('9')">9</button></td>
                <td><button onclick="escribir('/')">/</button></td>
            </tr>
            <tr>
                <td><button>4</button></td>
                <td><button>5</button></td>
                <td><button>6</button></td>
                <td><button>*</button></td>
            </tr>
            <tr>
                <td><button>1</button></td>
                <td><button>2</button></td>
                <td><button>3</button></td>
                <td><button>-</button></td>
            </tr>
            <tr>
                <td><button>0</button></td>
                <td><button>.</button></td>
                <td><button>=</button></td>
                <td><button>+</button></td>
            </tr>
            <tr>
                <td colspan="4"><button>Borrar</button></td>
            </tr>
        </tbody>
    </table>
  </body>
</html>
