<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ej2-2</title>

    <style>
        p {
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold; 
        }
        .lu1 {
            list-style-type: none;
            padding: 0;
            margin: 0;
            background-color: rgba(58, 63, 4, 0.63);
        }
        .li1 {
            display: inline-block;
            padding: 10px;
            margin-right: 5px;
            color: white;
        }
        .lu2 {
            padding: 0;
            margin: 0;
        }
        .li2 {
            padding: 15px;
            width: 100px;
            color: white;
            background-color: rgb(155, 219, 59);
        }
        .li3 {
            padding: 15px;
            width: 100px;
            color: white;
            background-color: rgb(255, 0, 0);
        }
    </style>
</head>

<body>
    <!--lista1-->
    <p>lista no ordenada -> menu horizontal</p>
    <ul class="lu1">
        <li class="li1">opcion1</li>
        <li class="li1">opcion2</li>
        <li class="li1">opcion3</li>
        <li class="li1">opcion4</li>
        <li class="li1">opcion5</li>
    </ul>
    <hr>
    <!--lista2-->
    <p>lista no ordenada -> menu vertical</p>
    <ul class="lu2">
        <li class="li2">opcion1</li>
        <li class="li2">opcion2</li>
        <li class="li3">opcion3</li>
        <li class="li2">opcion4</li>
        <li class="li2">opcion5</li>
    </ul>
    <hr>
</body>
</html>
